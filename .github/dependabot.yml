# Dependabot for this repository (see templates/dependabot.yml for the copyable template).
# Reference: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

updates:
  # GitHub Actions used by the repository's workflows (including SHA-pinned ones;
  # Dependabot keeps the "# vX.Y.Z" comment in sync).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

