name: Move major tag

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to point its major tag at (for example v1.3.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: move-major-tag
  cancel-in-progress: false

jobs:
  move:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Move major tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::$TAG is not a vMAJOR.MINOR.PATCH release tag"
            exit 1
          fi
          major="v${BASH_REMATCH[1]}"
          git fetch --force --tags origin
          sha="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$TAG ($sha) is not on main"
            exit 1
          fi
          latest="$(git tag --list "$major.*.*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          if [[ "$latest" != "$TAG" ]]; then
            echo "$TAG is not the latest $major release ($latest), leaving $major alone"
            exit 0
          fi
          current="$(git rev-parse --verify --quiet "refs/tags/$major^{commit}" || true)"
          if [[ "$current" == "$sha" ]]; then
            echo "$major already points at $sha"
            exit 0
          fi
          git tag --force "$major" "$sha"
          git push --force origin "refs/tags/$major"
          echo "$major moved from ${current:-nothing} to $sha ($TAG)"
