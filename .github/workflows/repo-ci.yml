name: Repository CI

on:
  workflow_call:
    inputs:
      gitleaks:
        description: Scan the full git history for secrets with gitleaks.
        type: boolean
        default: true
      actionlint:
        description: Lint .github/workflows with actionlint (and shellcheck for run steps).
        type: boolean
        default: true
      docker-build:
        description: Build the Dockerfile without pushing, using the GitHub Actions layer cache. Skipped when the Dockerfile is missing.
        type: boolean
        default: true
      docker-context:
        description: Docker build context, relative to the repository root.
        type: string
        default: "."
      dockerfile:
        description: Dockerfile path relative to docker-context.
        type: string
        default: Dockerfile
      runs-on:
        description: Runner label.
        type: string
        default: ubuntu-24.04

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  secrets:
    name: gitleaks
    if: inputs.gitleaks
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: gitleaks
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose .'

  actionlint:
    name: actionlint
    if: inputs.actionlint
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint

      - name: actionlint
        run: |
          if compgen -G ".github/workflows/*.y*ml" > /dev/null; then
            "$RUNNER_TEMP/actionlint" -color
          else
            echo "No workflows to lint"
          fi

  docker:
    name: Docker build
    if: inputs.docker-build
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect Dockerfile
        id: detect
        env:
          CONTEXT: ${{ inputs.docker-context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          if [[ -f "$CONTEXT/$DOCKERFILE" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No $CONTEXT/$DOCKERFILE, skipping Docker build"
          fi

      - name: Set up Buildx
        if: steps.detect.outputs.found == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        if: steps.detect.outputs.found == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.docker-context }}/${{ inputs.dockerfile }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
