name: Quality gate

on:
  workflow_call:
    inputs:
      gitleaks:
        description: Scan the full Git history for secrets.
        type: boolean
        default: true
      actionlint:
        description: Lint workflows when present.
        type: boolean
        default: true
      semgrep:
        description: Scan with pinned local Semgrep rules.
        type: boolean
        default: true
      semgrep-exclude-rules:
        description: Space-separated short rule IDs to ignore.
        type: string
        default: ""
      duplication:
        description: Check whole-scan duplication percentage.
        type: boolean
        default: true
      duplication-max:
        description: Maximum whole-scan duplication percentage.
        type: number
        default: 3
      duplication-new-clones:
        description: Reject new clones relative to base.
        type: boolean
        default: true
      duplication-formats:
        description: Comma-separated jscpd formats to scan for duplication.
        type: string
        default: javascript,typescript,jsx,tsx,vue,python,php,kotlin,java,bash
      complexity-max:
        description: Maximum new or increased function CCN; 0 disables.
        type: number
        default: 15
      diff-coverage-min:
        description: Minimum changed-line coverage percentage; 0 disables.
        type: number
        default: 80
      coverage-dir:
        description: Report directory; empty uses RUNNER_TEMP/coverage.
        type: string
        default: ""
      coverage-paths:
        description: Comma- or space-separated source globs requiring coverage.
        type: string
        default: "**/*.py,**/*.ts,**/*.tsx,**/*.js,**/*.jsx,**/*.mjs,**/*.cjs,**/*.php,**/*.kt"
      diff-cover-src-roots:
        description: Space-separated JaCoCo or Kover source roots.
        type: string
        default: ""
      exclude:
        description: Comma-separated globs added to built-in excludes.
        type: string
        default: ""
      base:
        description: Override the automatically computed base commit.
        type: string
        default: ""
      needs:
        description: Caller toJSON(needs).
        type: string
        default: "{}"
      allow-skipped:
        description: Space-separated job IDs allowed to be skipped.
        type: string
        default: ""
      coverage-artifacts:
        description: Coverage artifact name pattern.
        type: string
        default: coverage-*
      runs-on:
        description: Runner label.
        type: string
        default: ubuntu-24.04
    secrets:
      shared-ci-token:
        description: Token that can read this shared-CI repository while private.
        required: false

permissions:
  contents: read

jobs:
  gate:
    name: Quality gate
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .github-shared-ci
          sparse-checkout: actions
          persist-credentials: false
          token: ${{ secrets.shared-ci-token || github.token }}

      - name: Compute base
        id: base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          OVERRIDE: ${{ inputs.base }}
        run: |
          base="$OVERRIDE"
          if [[ -z "$base" && "$EVENT" == pull_request ]]; then
            base="$(git merge-base "$PR_BASE" HEAD)"
          elif [[ -z "$base" && "$EVENT" == push && -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]]; then
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              base="$BEFORE"
            fi
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github-shared-ci/actions/quality-gate/requirements.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .github-shared-ci/actions/quality-gate/package-lock.json

      - name: Download coverage reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.coverage-artifacts }}
          path: ${{ inputs.coverage-dir || format('{0}/coverage', runner.temp) }}

      - name: Quality gate
        uses: ./.github-shared-ci/actions/quality-gate
        with:
          gitleaks: ${{ inputs.gitleaks }}
          actionlint: ${{ inputs.actionlint }}
          semgrep: ${{ inputs.semgrep }}
          semgrep-exclude-rules: ${{ inputs.semgrep-exclude-rules }}
          duplication: ${{ inputs.duplication }}
          duplication-max: ${{ inputs.duplication-max }}
          duplication-new-clones: ${{ inputs.duplication-new-clones }}
          duplication-formats: ${{ inputs.duplication-formats }}
          complexity-max: ${{ inputs.complexity-max }}
          diff-coverage-min: ${{ inputs.diff-coverage-min }}
          coverage-dir: ${{ inputs.coverage-dir || format('{0}/coverage', runner.temp) }}
          coverage-paths: ${{ inputs.coverage-paths }}
          diff-cover-src-roots: ${{ inputs.diff-cover-src-roots }}
          exclude: ${{ inputs.exclude }}
          base: ${{ steps.base.outputs.sha }}
          needs: ${{ inputs.needs }}
          allow-skipped: ${{ inputs.allow-skipped }}
